<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bukhara Data Solutions</title>
  <style>
    :root {
      --bg: #0b1220;
      --bg-soft: #111a2e;
      --card: rgba(17, 26, 46, 0.72);
      --line: rgba(255,255,255,0.08);
      --text: #eef4ff;
      --muted: #b7c4df;
      --accent: #4f8cff;
      --accent-2: #7ed0ff;
      --success: #5dd39e;
      --shadow: 0 20px 50px rgba(0,0,0,0.35);
      --radius: 22px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(180deg, #08101d 0%, #0b1220 55%, #0d1424 100%);
      color: var(--text);
    }

    .container {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
    }

    .navbar {
      position: sticky;
      top: 0;
      backdrop-filter: blur(14px);
      background: rgba(8, 16, 29, 0.72);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
    }

    .brand {
      font-weight: 800;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      color: var(--muted);
    }

    .btn {
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: bold;
      background: #4f8cff;
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="container nav-inner">

    <!-- ✅ LOGO ADDED -->
    <div style="display:flex; align-items:center;">
      <img src="bukhara_main_logo_transparent_300dpi_for_invoice.png"
           alt="Bukhara Logo"
           style="height:32px; margin-right:10px;">
      <a href="#home" class="brand">Bukhara <span>Data Solutions</span></a>
    </div>

    <nav class="nav-links">
      <a href="#services">Services</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>

    <a class="btn" href="mailto:info@bukhdatasolution.ca">Book a Consultation</a>

  </div>
</header>

<main style="padding:60px 20px; text-align:center;">
  <h1>Build scalable data and cloud solutions</h1>
  <p>Modern data engineering, cloud, and DevOps solutions.</p>
</main>

<footer style="text-align:center; padding:20px;">
  © 2026 Bukhara Data Solutions
</footer>

</body>
</html>
